<table cellpadding="0" cellspacing="0" border="0"
    style="width: 100%; max-width: 500px; margin: 0px auto; background-color: #1f1b18; padding: 20px;">
    <tr>
        <td style="height: 8px;"></td>
    </tr>

    <tr>
        <td style="text-align: center;">
            <table cellpadding="0" cellspacing="0" border="0" style="display: inline;">
                <tr>
                    <td style="padding-right: 4px;">
                        <img src="{logo_image}" height="24" alt="Logo Image">
                    </td>
                    <td>
                        <h1 style="font-size: 24px; font-weight: 600; color: #fbe7d1; text-align: center; margin: 0;">
                            Welcome to Library
                        </h1>
                    </td>
                </tr>
            </table>

        </td>
    </tr>

    <tr>
        <td style="height: 4px;"></td>
    </tr>

    <tr>
        <td>
            <p style="font-size: 16px; color: #b2afad; text-align: center; margin: 0;">
                Your account has been created successfully
            </p>
        </td>
    </tr>

    <tr>
        <td style="height: 32px;"></td>
    </tr>

    <tr> <!-- Card -->
        <td
            style="width: 100%; background-color: #ea861a0d; border-radius: 4px; padding: 16px; border: 1px solid #ea861a33;">
            <p style="font-size: 14px; color: #fbe7d1; margin: 0 0 4px;">
                Account email:
            </p>
            <p style="font-size: 16px; color: #fbe7d1; font-weight: 500; margin: 0;">
                {email}
            </p>

        </td>
    </tr>

    <tr>
        <td style="height: 16px;"></td>
    </tr>

    <tr> <!-- Button -->
        <td style="background-color: #ea861a; border-radius: 4px; text-align: center;">
            <a href="{redirect}"
                style="display: block; color: #fffaf4; padding: 12px 24px; text-decoration: none; font-size: 16px; font-weight: 500;">
                Access Your Account
            </a>
        </td>
    </tr>

    <tr>
        <td style="height: 32px;"></td>
    </tr>

    <tr> <!-- Divider -->
        <td style="border-top: 1px solid #e5e5e5;"></td>
    </tr>

    <tr>
        <td style="height: 16px;"></td>
    </tr>

    <tr> <!-- Footer -->
        <td style="text-align: center;">
            <a href="{github_link}" style="text-decoration: none;">
                <table cellpadding="0" cellspacing="0" border="0" style="display: inline;">
                    <tr>
                        <td style="padding-right: 4px;">
                            <img src="{github_image}" height="24" alt="GitHub Logo" />
                        </td>
                        <td style="color: #b2afad; font-size:14px;">
                            GitHub
                        </td>
                    </tr>
                </table>
            </a>
        </td>
    </tr>
</table>
